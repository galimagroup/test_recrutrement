server:
  port: 9595
  servlet:
    context-path: /api
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace:
      include-exception: false

spring:
  profiles:
    active: default
  datasource:
    name: ${DB_NAME:recrutement-db}
    host: ${DB_HOST:127.0.0.1}
    username: ${DB_USERNAME:issa}
    password: ${DB_PASSWORD:issa}
    url: jdbc:mysql://${spring.datasource.host}:3306/${spring.datasource.name}?autoReconnect=true&useSSL=false&createDatabaseIfNotExist=true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    show-sql: false
  application:
    name: test-recrutement

recrutement:
  app:
    jwtSecret: secret
    jwtExpiration: 300

security-jwt:
  base64-secret: MmMzN2VlODJhN2U3NDk2NzQ2ZjE4Nzg3ZDkxYzg5ZDdkZDEwMTdjYWM3OWRiYjQwOWU4M2NiYTdmOThkYTU3OTI3Nzg2YTAwYTc2ODEyMzgwNjhiYTU2MTkyNDNmNWJiODc5Y2M4MWVhNjJhYTU3ZjRmNzEzZDhlZmYxNDlhYWM=
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 86400

recrutement-cors:
  cors:
    allowed-origins: "http://localhost:4200,http://localhost"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "Authorization,Link"
    allow-credentials: true
    max-age: 1800
