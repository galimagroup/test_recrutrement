<div class="card">
    <p-dataView #dv [value]="cart()">
        <ng-template pTemplate="list" let-products>
            <div class="grid grid-nogutter">
                @for (item of products; track item) {
                    <div class="col-12" class="col-12">
                        <p-card class="block mb-2" [style]="{'position': 'relative'}">
                            <div class="flex flex-column sm:flex-row sm:align-items-center p-4 gap-3">
                                <div
                                    class="flex flex-column md:flex-row justify-content-between md:align-items-center flex-1 gap-4">
                                    <div class="flex flex-row md:flex-column justify-content-between align-items-start gap-2">
                                        <div>
                                            <span class="font-medium text-secondary text-sm">{{ item.product.category }}</span>
                                            <div class="text-lg font-medium text-900 mt-2">{{ item.product.name }}</div>
                                            <div class="text-900 font-medium text-sm mt-2">{{ '$' + item.product.price }}</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-column md:align-items-end gap-5">
                                        <div class="card flex justify-content-center" style="position: absolute; top: 8px;">
                                            <p-inputNumber [(ngModel)]="item.quantity" [style]="{'width': '3rem'}" [showButtons]="true" buttonLayout="vertical"
                                                spinnerMode="vertical" inputId="vertical" decrementButtonClass="p-button-secondary" (ngModelChange)="updateQuntity(item)"
                                                incrementButtonClass="p-button-secondary" incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" /></div>
                                        <span class="text-xl font-semibold text-900" style="position: absolute; top: 142px; right: 45px;">{{ '$' + item.total }}</span>
                                    </div>
                                </div>
                            </div>
                        </p-card>
                    </div>
                }
            </div>
        </ng-template>
    </p-dataView>
</div>
