<div class="container py-5">
    <div class="row">
      <div class="col-12">
        <h2 class="text-center mb-4">Mon Panier</h2>
        
        <ng-container *ngIf="(cart$ | async)?.items?.length; else emptyCart">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="list-group list-group-flush">
                <div *ngFor="let item of (cart$ | async)?.items" class="list-group-item py-3">
                  <div class="row align-items-center">
                    <div class="col-12 col-md-2">
                      <img [src]="item.product.image" [alt]="item.product.name" class="img-fluid rounded">
                    </div>
                    <div class="col-12 col-md-4">
                      <h5 class="mb-1">{{item.product.name}}</h5>
                      <p class="text-muted mb-0">Prix unitaire: {{item.product.price}} fcfa</p>
                    </div>
                    <div class="col-12 col-md-3">
                      <div class="input-group">
                        <button class="btn btn-outline-secondary" type="button" 
                          (click)="updateQuantity(item.product.id, item.quantity - 1)">
                          <i class="bi bi-dash"></i>
                        </button>
                        <input type="text" class="form-control text-center" [value]="item.quantity" readonly>
                        <button class="btn btn-outline-secondary" type="button"
                          (click)="updateQuantity(item.product.id, item.quantity + 1)">
                          <i class="bi bi-plus"></i>
                        </button>
                      </div>
                    </div>
                    <div class="col-12 col-md-2 text-end">
                      <strong>{{item.product.price * item.quantity}} fcfa</strong>
                    </div>
                    <div class="col-12 col-md-1 text-end">
                      <button class="btn btn-outline-danger btn-sm" (click)="removeFromCart(item.product.id)">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-footer">
              <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Total</h4>
                <h4 class="mb-0">{{(cart$ | async)?.total}} fcfa</h4>
              </div>
            </div>
          </div>
        </ng-container>
  
        <ng-template #emptyCart>
          <div class="alert alert-info text-center">
            <i class="bi bi-cart-x fs-1 d-block mb-3"></i>
            <p class="mb-0">Votre panier est vide</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
