<div class="container py-5">
  <h2 class="text-center mb-4">Nos Produits</h2>

  <div class="row mb-3">
    <div class="col-12 col-md-6 offset-md-3">
      <input type="text" class="form-control" placeholder="Rechercher un produit..." [(ngModel)]="filterTerm" (input)="onFilterChange()">
    </div>
  </div>
  <div class="row g-4">
    <div *ngFor="let product of pagedProducts" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img [src]="product.image.startsWith('http') ? product.image : 'assets/' + product.image" [alt]="product.name" class="card-img-top product-img">
        <div class="card-body">
          <h5 class="card-title">{{product.name}}</h5>
          <p class="card-text">{{product.description}}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="h5 mb-0">{{product.price}} fcfa</span>
            <span [class]="'badge ' + getStatusBadgeClass(product.inventoryStatus)">
              {{product.inventoryStatus}}
            </span>
          </div>
          <div class="d-flex gap-2 mt-3">
            
            <button 
              class="btn btn-primary w-100" 
              (click)="addToCart(product)" 
              [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"
            >
              <i class="bi bi-cart-plus"></i> Ajouter au panier
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav *ngIf="totalPages > 1" class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" (click)="goToPage(currentPage - 1)">Précédent</a>
      </li>
      <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i+1">
        <a class="page-link" (click)="goToPage(i+1)">{{ i+1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <a class="page-link" (click)="goToPage(currentPage + 1)">Suivant</a>
      </li>
    </ul>
  </nav>
</div>
