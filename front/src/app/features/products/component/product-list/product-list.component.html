<div class="container py-5">
  <h2 class="text-center mb-4">Nos Produits</h2>
  <div class="row g-4">
    <div *ngFor="let product of products" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img [src]="product.image" [alt]="product.name" class="card-img-top product-img">
        <div class="card-body">
          <h5 class="card-title">{{product.name}}</h5>
          <p class="card-text">{{product.description}}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="h5 mb-0">{{product.price}} fcfa</span>
            <span [class]="'badge ' + getStatusBadgeClass(product.inventoryStatus)">
              {{product.inventoryStatus}}
            </span>
          </div>
          <button 
            class="btn btn-primary w-100 mt-3" 
            (click)="addToCart(product)" 
            [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"
          >
            <i class="bi bi-cart-plus"></i> Ajouter au panier
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
