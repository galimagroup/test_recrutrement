<div class="container py-5">
  <h2 class="text-center mb-4">Ma liste d'envie</h2>
  <div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>
  <div *ngIf="errorMsg" class="alert alert-danger text-center">{{ errorMsg }}</div>
  <div *ngIf="!loading && wishlist.length === 0" class="alert alert-info text-center">
    Votre liste d'envie est vide.
  </div>
  <div class="row g-4" *ngIf="!loading && wishlist.length > 0">
    <div *ngFor="let item of wishlist" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img [src]="item.product.image" [alt]="item.product.name" class="card-img-top product-img">
        <div class="card-body">
          <h5 class="card-title">{{item.product.name}}</h5>
          <p class="card-text">{{item.product.description}}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="h5 mb-0">{{item.product.price}} fcfa</span>
            <span class="badge bg-secondary">Wishlist</span>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-outline-danger flex-shrink-0" (click)="removeFromWishlist(item.product.id)" aria-label="Retirer de la liste d'envie">
              <i class="bi bi-heart-fill"></i>
            </button>
            <button class="btn btn-outline-primary w-100" (click)="goToProduct(item.product.id)">
              <i class="bi bi-eye"></i> Voir le produit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
